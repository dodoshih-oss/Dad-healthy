<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>爸媽的照顧網站</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>爸媽的照顧網站</h1>

    <!-- 人物切換：點擊照片切換要看爸爸還是媽媽的資料 -->
    <div class="person-switcher">
      <button type="button" class="person-btn active" data-person="dad">
        <img src="dad-avatar.png?v=2" alt="爸爸的照片" class="avatar" />
        <span>爸爸</span>
      </button>
      <button type="button" class="person-btn" data-person="mom">
        <img src="mom-avatar.png?v=6" alt="媽媽的照片" class="avatar" />
        <span>媽媽</span>
      </button>
    </div>

    <p class="sub">記錄病歷、檢查排程、看診時間表、照顧、長照申請進度與代墊款</p>
    <p class="sync-status" id="visit-sync-status"></p>
  </header>

  <!-- 分頁按鈕：點擊切換不同區塊 -->
  <nav class="tabs">
    <button class="tab-btn active" data-tab="medical">病歷資料</button>
    <button class="tab-btn" data-tab="exam">檢查排程</button>
    <button class="tab-btn" data-tab="visit">看診時間表</button>
    <button class="tab-btn" data-tab="care">照顧記錄</button>
    <button class="tab-btn" data-tab="ltc">長照申請進度</button>
    <button class="tab-btn" data-tab="advance">代墊款</button>
  </nav>

  <main>

    <!-- ===== 病歷資料 ===== -->
    <section id="medical" class="tab-content active">
      <h2>病歷資料</h2>
      <form id="medical-form" class="add-form">
        <input type="date" name="date" required />
        <input type="text" name="title" placeholder="病症 / 診斷名稱" required />
        <input type="text" name="note" placeholder="備註（例如：檢查結果、醫囑）" />
        <button type="submit">新增紀錄</button>
      </form>
      <table>
        <thead><tr><th>日期</th><th>病症 / 診斷</th><th>備註</th><th></th></tr></thead>
        <tbody id="medical-list"></tbody>
      </table>
    </section>

    <!-- ===== 檢查排程 ===== -->
    <section id="exam" class="tab-content">
      <h2>檢查排程</h2>

      <!-- 篩選區：檢查排程的資料是從醫院系統匯入的，不開放手動新增，只提供篩選查看 -->
      <div class="search-bar">
        <label>單據類別：
          <select id="exam-filter-category">
            <option value="all" selected>全部</option>
            <option value="labTest">檢驗單</option>
            <option value="examCheck">檢查單</option>
            <option value="radiology">放射單</option>
          </select>
        </label>
        <label>顯示範圍：
          <select id="exam-filter-status">
            <option value="valid" selected>未過期</option>
            <option value="all">全部（含已過期）</option>
            <option value="expired">已過期</option>
          </select>
        </label>
      </div>

      <!-- 三種單據合併成同一個表格，欄位對齊，手機上比較好讀
           資料都是從醫院系統匯入的，不開放新增／編輯／刪除，只提供篩選查看 -->
      <table>
        <thead><tr><th>類別</th><th>科別／項目</th><th>醫師</th><th>日期</th><th>地點／檢體</th></tr></thead>
        <tbody id="exam-list"></tbody>
      </table>
    </section>

    <!-- ===== 看診時間表 ===== -->
    <section id="visit" class="tab-content">
      <h2>看診時間表</h2>

      <!-- 這裡的資料都是從 Google 行事曆同步過來的，不開放手動新增，只提供搜尋查看
           只有「照顧者①」「照顧者②」「備註」這三欄可以在網站上編輯 -->
      <div class="search-bar">
        <label>日期起：<input type="date" id="visit-search-start" /></label>
        <label>日期迄：<input type="date" id="visit-search-end" /></label>
        <label>照顧者：
          <select id="visit-search-caregiver">
            <option value="">不限</option>
            <option value="甄">甄</option>
            <option value="瑤">瑤</option>
            <option value="慈">慈</option>
            <option value="書">書</option>
            <option value="沛">沛</option>
          </select>
        </label>
        <label>顯示範圍：
          <select id="visit-search-status">
            <option value="valid" selected>未過期</option>
            <option value="all">全部（含已過期）</option>
            <option value="expired">已過期</option>
          </select>
        </label>
        <button type="button" id="visit-search-btn">搜尋</button>
        <button type="button" id="visit-search-clear-btn">清除搜尋</button>
      </div>

      <table class="visit-table">
        <thead><tr><th>日期</th><th>時間</th><th>醫院 / 科別</th><th>照顧①</th><th>照顧②</th><th>備註</th><th></th></tr></thead>
        <tbody id="visit-list"></tbody>
      </table>
    </section>

    <!-- ===== 照顧記錄 ===== -->
    <section id="care" class="tab-content">
      <h2>每次照顧記錄</h2>
      <form id="care-form" class="add-form">
        <input type="date" name="date" required />
        <input type="text" name="content" placeholder="照顧內容（例如：協助洗澡、量血壓）" required />
        <input type="text" name="note" placeholder="備註" />
        <button type="submit">新增紀錄</button>
      </form>
      <table>
        <thead><tr><th>日期</th><th>照顧內容</th><th>備註</th><th></th></tr></thead>
        <tbody id="care-list"></tbody>
      </table>
    </section>

    <!-- ===== 長照申請進度 ===== -->
    <section id="ltc" class="tab-content">
      <h2>長照申請進度 / 資料</h2>
      <form id="ltc-form" class="add-form">
        <input type="text" name="item" placeholder="申請項目（例如：長照2.0評估）" required />
        <select name="status" required>
          <option value="申請中">申請中</option>
          <option value="審核中">審核中</option>
          <option value="已核准">已核准</option>
          <option value="已完成">已完成</option>
        </select>
        <input type="date" name="date" required />
        <input type="text" name="note" placeholder="備註（例如：聯絡窗口、待補文件）" />
        <button type="submit">新增項目</button>
      </form>
      <table>
        <thead><tr><th>申請項目</th><th>狀態</th><th>日期</th><th>備註</th><th></th></tr></thead>
        <tbody id="ltc-list"></tbody>
      </table>
    </section>

    <!-- ===== 代墊款 ===== -->
    <section id="advance" class="tab-content">
      <h2>代墊款</h2>
      <form id="advance-form" class="add-form">
        <input type="date" name="date" required />
        <select name="item" required>
          <option value="">代墊款項目</option>
          <option value="輔具">輔具</option>
          <option value="長照服務">長照服務</option>
          <option value="診療費">診療費</option>
          <option value="醫療物資">醫療物資</option>
        </select>
        <input type="number" name="amount" placeholder="金額" min="0" step="1" required />
        <select name="payer" required>
          <option value="">代墊款人</option>
          <option value="甄">甄</option>
          <option value="瑤">瑤</option>
          <option value="慈">慈</option>
          <option value="書">書</option>
          <option value="沛">沛</option>
        </select>
        <input type="text" name="note" placeholder="備註" />
        <button type="submit">新增紀錄</button>
      </form>
      <table>
        <thead><tr><th>日期</th><th>項目</th><th>金額</th><th>代墊款人</th><th>備註</th><th></th></tr></thead>
        <tbody id="advance-list"></tbody>
      </table>
    </section>

  </main>

  <footer>
    <p>點上方照片可以切換「爸爸」「媽媽」，各自的資料分開存放、互不影響。<br />病歷、檢查排程、照顧、長照申請進度、代墊款存在這台電腦的瀏覽器裡（localStorage）。<br />看診時間表已改成連線 Supabase 資料庫，換電腦打開也看得到，但需要能連上網路。</p>
  </footer>

  <!-- Supabase 官方 JS 函式庫（從網路載入），看診記錄要靠它跟資料庫溝通 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="script.js"></script>
</body>
</html>
